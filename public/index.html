<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>SocialFlow</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0d12;--sb:#111218;--card:#16171f;--c2:#1d1f2a;--bd:#272935;--tx:#e8e9ef;--mu:#8b8ea0;--ac:#4f52e0;--ok:#3fb27f;--er:#e5484d;--wa:#e8a33d}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:228px 1fr;height:100vh}
aside{background:var(--sb);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:18px 12px;gap:2px;overflow:auto}
.logo{font-size:19px;font-weight:600;padding:0 10px 18px}
.nav{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;color:var(--mu);text-decoration:none}
.nav:hover{background:var(--c2)}.nav.on{background:var(--c2);color:var(--tx)}
.sp{flex:1}.me{display:flex;gap:10px;align-items:center;padding:12px 10px 0;border-top:1px solid var(--bd);margin-top:10px}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#f5b27a,#8a5a44);flex:none}
.col{display:flex;flex-direction:column;min-width:0;height:100vh}
header{display:flex;gap:14px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--bd)}
.search{flex:0 1 480px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 12px;margin:0 auto 0 0;width:100%}
main{padding:24px;overflow:auto;flex:1}
h1{font-size:26px;font-weight:600;margin:0}h2{font-size:16px;font-weight:500;margin:0 0 12px}
.sub{color:var(--mu);margin:4px 0 0}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.btn{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover{background:var(--c2)}.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.p:hover{filter:brightness(1.1)}
.btn.d{color:var(--er)}.btn.sm{padding:4px 10px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.grid{display:grid;gap:14px}.g6{grid-template-columns:repeat(6,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.stat b{display:block;font-size:30px;font-weight:500;margin-top:6px}.mu{color:var(--mu)}.up{color:var(--ok)}
.tag{display:inline-block;padding:2px 9px;border-radius:6px;font-size:12px;background:var(--c2)}
.published,.connected{background:#143526;color:#5fd6a0}.scheduled{background:#2a2c3a;color:#b9bbd0}.failed,.reauth{background:#3a1a1d;color:#ff7b80}.draft{background:#332a14;color:var(--wa)}
.pb{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font-size:13px;font-weight:600;flex:none;border:1px solid #ffffff22}
.tabs{display:inline-flex;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:3px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:6px 14px;border-radius:6px;cursor:pointer;color:var(--mu)}.tabs button.on{background:var(--c2);color:var(--tx)}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus,.btn:focus-visible{border-color:var(--ac)}
textarea{width:100%;resize:vertical}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:11px 12px;border-top:1px solid var(--bd);font-weight:400}th{color:var(--mu);font-size:12px;border:0;background:var(--c2)}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.jb{justify-content:space-between}
.th{width:44px;height:44px;border-radius:8px;flex:none;background-size:cover}
.sel{cursor:pointer}.sel.on{border-color:var(--ac);background:#1c1e3a}
.drop{border:1.5px dashed #3a3d50;border-radius:10px;padding:26px;text-align:center;color:var(--mu);cursor:pointer}.drop.hv{border-color:var(--ac)}
.tg{width:36px;height:20px;border-radius:20px;background:#3a3d50;position:relative;cursor:pointer;border:0;flex:none}.tg:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}.tg.on{background:var(--ac)}.tg.on:after{left:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.cal>div{min-height:112px;border:1px solid var(--bd);margin:-.5px;padding:6px;font-size:12px;background:var(--card);min-width:0}.cal .h{min-height:0;text-align:center;color:var(--mu);background:var(--sb)}
.cal .td{background:#1a1c36}.cal .ev{display:flex;gap:6px;align-items:center;background:var(--c2);border:1px solid var(--bd);border-radius:6px;padding:4px;margin-top:4px;cursor:grab;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal .ev .pb{width:18px;height:18px;font-size:10px}.cal .over{background:#23264a}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50;padding:16px}.md{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:99}#toast div{background:var(--c2);border:1px solid var(--bd);border-left:3px solid var(--ac);padding:10px 14px;border-radius:8px}
.phone{width:230px;height:420px;margin:10px auto;border:6px solid #2a2c38;border-radius:30px;background:linear-gradient(#2b2d3a,#0d0d12);padding:14px;display:flex;flex-direction:column;justify-content:flex-end;font-size:12px}
.set{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--bd)}
.mb{display:none}.bar{height:6px;border-radius:4px;background:var(--c2);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
@media(max-width:1100px){.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:fixed;inset:0 auto 0 0;width:250px;z-index:40;transform:translateX(-100%);transition:.2s}aside.open{transform:none}.mb{display:block}
.g3,.g2{grid-template-columns:1fr}main{padding:16px}header{padding:10px 16px}.cal>div{min-height:70px;padding:3px}.cal .ev span:last-child{display:none}
.rt thead{display:none}.rt tr{display:block;border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;padding:6px}.rt td{display:block;border:0;padding:4px 8px}}
@media(max-width:560px){.g6,.g4{grid-template-columns:1fr 1fr}h1{font-size:22px}.hid{display:none}}
</style></head><body>
<div class="app"><aside id="sb"></aside><div class="col"><header><button class="btn mb" data-a="menu">☰</button><input class="search" id="gs" placeholder="Search"><button class="btn p" data-a="go" data-v="create">+ Quick Create</button><div class="av"></div></header><main id="main"></main></div></div>
<div id="toast"></div><div id="modal"></div>
<script>
/* ============ DATA + SERVICES (mock layer: swap with real API calls later) ============ */
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),uid=()=>Math.random().toString(36).slice(2,9);
const PL={tiktok:{n:'TikTok',c:'#000',i:'♪'},instagram:{n:'Instagram',c:'linear-gradient(45deg,#f9a03f,#e1306c,#833ab4)',i:'◎'},facebook:{n:'Facebook',c:'#1877f2',i:'f'},youtube:{n:'YouTube',c:'#f00',i:'▶'}};
const bd=p=>`<span class="pb" title="${PL[p].n}" style="background:${PL[p].c}">${PL[p].i}</span>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const grad=s=>`background-image:linear-gradient(${s*47%360}deg,hsl(${s*53%360} 45% 35%),hsl(${(s*53+60)%360} 50% 20%))`;
const DB={
 accounts:[{id:'a1',platform:'tiktok',name:'@creator_vlog',posts:128,followers:'84K',sync:'2h ago',status:'connected'},{id:'a2',platform:'tiktok',name:'@brand_official',posts:45,followers:'15K',sync:'1d ago',status:'connected'},
 {id:'a3',platform:'instagram',name:'@brand_official',posts:102,followers:'60K',sync:'2h ago',status:'connected'},{id:'a4',platform:'instagram',name:'@art_studio',posts:23,followers:'5K',sync:'1d ago',status:'connected'},
 {id:'a5',platform:'instagram',name:'@personal_account',posts:8,followers:'200',sync:'7d ago',status:'reauth'},{id:'a6',platform:'facebook',name:'Official Brand Page',posts:15,followers:'1.2M',sync:'2h ago',status:'connected'},
 {id:'a7',platform:'youtube',name:'My Brand Channel',posts:9,followers:'54K',sync:'1h ago',status:'connected'}],
 posts:[],media:[],activity:[]};
(function seed(){const T=['Daily Vlog','Fall Collection','Behind Scenes','Quick Tips','Product Launch','Community Update','Sneak Peek','Review'],now=new Date();now.setHours(0,0,0,0);
 for(let i=0;i<26;i++){const d=new Date(now);d.setDate(d.getDate()+i-16);d.setHours(8+i%9,0);const a=DB.accounts[i%7],past=d<new Date();
 DB.posts.push({id:'p'+i,title:T[i%8],caption:T[i%8]+' — new content for our audience #brand',acct:a.id,platform:a.platform,date:d.toISOString(),status:i%11==5?'failed':i%9==8?'draft':past?'published':'scheduled',reach:past?(1+i%5)*12000:0,likes:past?(i%7+1)*900:0,seed:i});}
 for(let i=0;i<15;i++)DB.media.push({id:'m'+i,name:'autumn_campaign_'+(i+1)+(i%3?'.jpg':'.mp4'),type:i%3?'image':'video',size:(2+i%5*3.3).toFixed(1)+' MB',date:'2026-09-'+String(1+i).padStart(2,'0'),used:i%2==0,seed:i+3});
 [['published','Post "Daily Vlog" published to TikTok @creator_vlog'],['scheduled','Post "Fall Collection" scheduled for Oct 1'],['info','Media autumn_campaign_3.jpg uploaded'],['published','Account Facebook Official Brand Page connected'],['failed','Publishing failed on YouTube: title required'],['reauth','Instagram @personal_account requires reconnection']].forEach((x,i)=>DB.activity.push({t:x[0],m:x[1],when:(i+1)*37+' min ago'}));})();
const log=(t,m)=>DB.activity.unshift({t,m,when:'just now'});
const contentService={list:()=>DB.posts,remove:id=>DB.posts=DB.posts.filter(p=>p.id!=id),dup(id){const p=DB.posts.find(p=>p.id==id);DB.posts.unshift({...p,id:'p'+uid(),status:'draft'})},move(id,d){const p=DB.posts.find(p=>p.id==id);const o=new Date(p.date);const n=new Date(d);n.setHours(o.getHours(),o.getMinutes());p.date=n.toISOString()},
 add(req,st){req.accounts.forEach(a=>DB.posts.unshift({id:'p'+uid(),title:req.caption.slice(0,24)||'Untitled',caption:req.caption,acct:a.id,platform:a.platform,date:(req.schedule?new Date(req.schedule.date+'T'+req.schedule.time):new Date()).toISOString(),status:st,reach:0,likes:0,seed:Math.floor(Math.random()*90)}))}};
const socialAccountsService={list:()=>DB.accounts,connect(p){/* TODO: real OAuth redirect; tokens stay server-side */DB.accounts.push({id:'a'+uid(),platform:p,name:'@new_'+p,posts:0,followers:'0',sync:'just now',status:'connected'});log('published','Account '+PL[p].n+' connected (mock)')},
 reconnect(id){const a=DB.accounts.find(a=>a.id==id);a.status='connected';a.sync='just now'},disconnect(id){DB.accounts=DB.accounts.filter(a=>a.id!=id);log('failed','Account disconnected')}};
const mediaService={list:()=>DB.media,remove:id=>DB.media=DB.media.filter(m=>m.id!=id)};
const analyticsService={series(n,base){return Array.from({length:n},(_,i)=>base*(1+.5*Math.sin(i/3)+i/n))},kpis:()=>({reach:'1.2M',imp:'3.8M',eng:'4.8%',fol:'184K'})};
/* Platform adapters: each isolates one platform's API. Mocks NEVER pretend a real request happened. */
const mk=(need)=>({async publish(req,a){await sleep(700+Math.random()*1500);if(a.status!=='connected')throw Error('Account needs reconnection');need(req,a);return{mock:true}}});
const ADAPTERS={tiktok:mk(r=>{if(!r.media.length)throw Error('TikTok requires a video')}),instagram:mk(r=>{if(!r.media.length)throw Error('Instagram requires media')}),facebook:mk(()=>{}),youtube:mk(r=>{if(!r.media.length)throw Error('YouTube requires a video');if(!r.settings.ytTitle)throw Error('Video title required')})};
const publishingService={async publishPost(req,on){const res=req.accounts.map(a=>({a,status:'pending'}));on(res);await this.run(req,res,on);return res},
 async run(req,res,on){await Promise.all(res.filter(r=>r.status=='pending'||r.status=='failed').map(async r=>{r.status='uploading';r.error='';on(res);try{await ADAPTERS[r.a.platform].publish(req,r.a);r.status=req.schedule?'scheduled':'published'}catch(e){r.status='failed';r.error=e.message}on(res)}))}};
/* ============ UI HELPERS ============ */
const S={page:'dashboard',sel:new Set(),files:[],caption:'',mode:'now',prev:'tiktok',cs:{privacy:'Public',duet:true,stitch:true,firstComment:true,reel:false,ytTitle:'',vis:'Public',kids:false,cta:'Learn more'},sched:{date:'',time:'12:00',tz:'GMT+3'},
 ctab:'all',cq:'',csort:'new',cview:'list',cmode:'month',cur:new Date(),mf:'all',mq:'',pf:'all',stab:'general',aRange:30};
const $=s=>document.querySelector(s),toast=m=>{const d=document.createElement('div');d.textContent=m;$('#toast').append(d);setTimeout(()=>d.remove(),3000)};
const modal=h=>{$('#modal').innerHTML=h?`<div class="ov" data-a="mclose"><div class="md">${h}</div></div>`:''};
const confirmDlg=(t,fn)=>{S.cf=fn;modal(`<h2>${t}</h2><p class="mu">This action cannot be undone.</p><div class="row jb"><button class="btn" data-a="mclose2">Cancel</button><button class="btn p" data-a="cfok">Delete</button></div>`)};
const fd=d=>new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),ft=d=>new Date(d).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const tg=(k,o)=>`<button class="tg ${o?'on':''}" data-a="tg" data-v="${k}"></button>`;
const stat=(l,v,x='')=>`<div class="card stat"><span class="mu">${l}</span><b>${v}</b>${x}</div>`;
const tag=s=>`<span class="tag ${s}">${{reauth:'Needs reconnection'}[s]||s[0].toUpperCase()+s.slice(1)}</span>`;
const thumb=p=>`<div class="th" style="${grad(p.seed)}"></div>`;
function chart(a,b){const W=600,H=180,m=Math.max(...a),pt=s=>s.map((v,i)=>`${i*W/(s.length-1)},${H-v/m*H*.9}`).join(' ');
 return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:200px"><polygon points="0,${H} ${pt(a)} ${W},${H}" fill="#4f7ff31f"/><polyline points="${pt(a)}" fill="none" stroke="#4f8ff3" stroke-width="2"/><polyline points="${pt(b)}" fill="none" stroke="#8b6ce6" stroke-width="2"/></svg>`}
const ring=(v,c)=>`<svg width="54" height="54" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="#2a2c38" stroke-width="3"/><circle cx="18" cy="18" r="15" fill="none" stroke="${c}" stroke-width="3" stroke-dasharray="${v*.94} 100" transform="rotate(-90 18 18)"/><text x="18" y="21" text-anchor="middle" fill="#e8e9ef" font-size="9">${v}</text></svg>`;
const NAV=[['dashboard','Dashboard','⌂'],['create','Create Post','✎'],['content','Content','▤'],['calendar','Calendar','▦'],['accounts','Accounts','☺'],['analytics','Analytics','▥'],['media','Media Library','▣'],['activity','Activity','∿']];
/* ============ PAGES ============ */
const P={};
P.dashboard=()=>{const ps=DB.posts,ok=ps.filter(p=>p.status=='published').length,sc=ps.filter(p=>p.status=='scheduled'),fl=ps.filter(p=>p.status=='failed').length,a=analyticsService.series(20,40),b=analyticsService.series(20,20);
 return `<div class="top"><div><h1>Good evening, Mohammad</h1><p class="sub">Here's what's happening across your social accounts</p></div></div>
 <div class="grid g6">${stat('Connected accounts',DB.accounts.length)}${stat('Published posts',ok)}${stat('Scheduled posts',sc.length)}${stat('Failed posts',`<span class="${fl?'':''}" style="color:var(--er)">${fl}</span>`)}${stat('Reach','1.2M')}${stat('Engagement','84K')}</div>
 <div class="row jb" style="margin:22px 0 10px"><h2 style="margin:0">Connected Accounts</h2><a href="#accounts" style="color:#8b8ef0">View all accounts ›</a></div>
 <div class="grid g4">${['tiktok','instagram','facebook','youtube'].map(p=>{const a=DB.accounts.find(x=>x.platform==p);return a?`<div class="card"><div class="row">${bd(p)}<div><b>${PL[p].n}</b><div class="mu">${esc(a.name)}</div></div></div><p>${tag(a.status)}</p><span class="mu">Recent activity: ${a.sync}</span></div>`:''}).join('')}</div>
 <div class="grid" style="grid-template-columns:2fr 1.3fr 1fr;margin-top:22px;gap:14px" id="dg"><div class="card"><h2>Recent Publishing Activity</h2><table class="rt"><thead><tr><th>Content<th>Platform<th>Status<th>Published</thead>${ps.slice(0,5).map(p=>`<tr><td>${esc(p.title)}<td>${bd(p.platform)}<td>${tag(p.status)}<td>${fd(p.date)}`).join('')}</table></div>
 <div class="card"><h2>Performance Overview</h2>${chart(a,b)}</div><div class="card"><h2>Upcoming Posts</h2>${sc.slice(0,4).map(p=>`<div class="row" style="margin-bottom:10px">${thumb(p)}<div><div>${esc(p.title)}</div><span class="mu">${fd(p.date)} ${ft(p.date)}</span></div></div>`).join('')}</div></div>
 <style>@media(max-width:1100px){#dg{grid-template-columns:1fr!important}}</style>`};
P.create=()=>{const ac=DB.accounts,sel=ac.filter(a=>S.sel.has(a.id)),n=sel.length,pls=[...new Set(sel.map(a=>a.platform))];
 return `<div class="top"><h1>Create Post</h1><div class="row wrap"><button class="btn" data-a="draft">Save Draft</button><button class="btn" data-a="modeS">Schedule ▾</button><button class="btn p" data-a="publish">${S.mode=='sched'?'Schedule':'Publish'} to ${n} Account${n==1?'':'s'}</button></div></div>
 <div class="grid" style="grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)" id="cg"><div class="grid" style="gap:14px;align-content:start">
 <div class="card"><h2>Publish to</h2><div class="grid g4">${ac.map(a=>`<div class="card sel ${S.sel.has(a.id)?'on':''}" data-a="acc" data-v="${a.id}" style="padding:10px"><div class="row">${bd(a.platform)}<div style="min-width:0"><b>${PL[a.platform].n}</b><div class="mu" style="font-size:12px;overflow:hidden;text-overflow:ellipsis">${esc(a.name)}</div></div></div></div>`).join('')}</div>
 <div class="row jb" style="margin-top:12px"><span><button class="btn sm" data-a="all">Select All</button> <button class="btn sm" data-a="none">Clear All</button></span><span class="mu">${n} account${n==1?'':'s'} selected</span></div></div>
 <div class="card"><div class="drop" id="dz" data-a="pick">Drag photos/videos here or click to browse<br><small>Supports MP4, MOV, JPG, PNG up to 500MB</small></div><input type="file" id="fi" multiple accept="image/*,video/*" hidden>
 <div class="row wrap" style="margin-top:10px">${S.files.map((f,i)=>`<div style="position:relative">${f.type.startsWith('image')?`<img src="${f.url}" class="th" style="object-fit:cover" alt="">`:`<div class="th" style="background:#333;display:grid;place-items:center">▶</div>`}<button class="btn sm d" style="position:absolute;top:-8px;right:-8px;padding:0 6px" data-a="rmf" data-v="${i}">×</button><div class="mu" style="font-size:11px;max-width:60px;overflow:hidden">${(f.size/1048576).toFixed(1)} MB</div></div>`).join('')}</div></div>
 <div class="card"><div class="row jb"><h2 style="margin:0">Caption &amp; Copywriting Editor</h2><span class="mu">${S.caption.length} / 2,200</span></div><textarea id="cap" rows="4" maxlength="2200" placeholder="Add a caption text..." style="margin:10px 0">${esc(S.caption)}</textarea>
 <div class="row wrap"><button class="btn sm" data-a="ins" data-v=" #">Hashtag #</button><button class="btn sm" data-a="ins" data-v=" @">Mention @</button><button class="btn sm" data-a="ins" data-v=" 😀">Emoji 😀</button></div>
